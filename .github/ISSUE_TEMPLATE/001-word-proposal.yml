name: 語彙の追加
description: ((マスターチェックリスト))に記載の概念について、KLeRing 統一言語の語彙案を提案する。
title: "語彙の追加: "
labels: ["提案中"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提案する語彙 (Swadesh リストの番号と概念名)
        ((マスターチェックリスト)) Issue を開いて、提案する語彙の登録状況を確認してください。
  - type: input
    id: concept
    attributes:
      label: 概念 (番号＋名称)
      placeholder: "例: 75. water"
    validations:
      required: true
  - type: textarea
    id: word
    attributes:
      label: 提案する語彙
      description: この概念に付ける KLeRing 統一言語の語彙
      placeholder: "例: maa"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 備考 (根拠・由来など)
      description: なぜこの形にしたか (音韻イメージ・既存語との関係など)
  - type: markdown
    attributes:
      value: |
        ## 決まり方（lazy consensus）
        この提案に対して **7日間** 明確な異議・対案が出なければ **自動で確定** します。
